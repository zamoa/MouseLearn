<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마우스 연습 게임</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐭</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    cursor: none;
  }

  #custom-cursor {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    transition: width 0.2s, height 0.2s, scale 0.1s;
    filter: drop-shadow(2px 3px 4px rgba(0,0,0,0.3));
  }

  #custom-cursor svg {
    width: 100%;
    height: 100%;
  }

  #custom-cursor span {
    font-size: 42px;
    line-height: 1;
  }

  /* 기본 화살표 */
  #custom-cursor.mode-default {
    width: 44px;
    height: 44px;
    transform: translate(-6px, -3px);
  }

  /* 호버: 손가락 이모지 */
  #custom-cursor.mode-pointer {
    transform: translate(-12px, -5px);
    animation: cursorBounce 0.3s ease-out;
  }

  #custom-cursor.mode-pointer span {
    font-size: 42px;
  }

  /* 드래그: 주먹 이모지 */
  #custom-cursor.mode-grab {
    transform: translate(-14px, -8px);
    animation: cursorBounce 0.3s ease-out;
  }

  #custom-cursor.mode-grab span {
    font-size: 52px;
  }

  @keyframes cursorBounce {
    0% { scale: 0.7; }
    60% { scale: 1.15; }
    100% { scale: 1; }
  }

  #header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 32px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    border-bottom: 3px solid rgba(255,255,255,0.5);
    z-index: 100;
    position: relative;
  }

  #header h1 {
    font-size: 28px;
    color: #5b4a9e;
  }

  .stage-indicator {
    display: flex;
    gap: 12px;
  }

  .stage-dot {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #ddd;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
    color: #999;
    transition: all 0.3s;
  }

  .stage-dot.active {
    background: #7c5cbf;
    color: white;
    transform: scale(1.2);
    box-shadow: 0 4px 15px rgba(124,92,191,0.4);
  }

  .stage-dot.done {
    background: #4ecdc4;
    color: white;
  }

  #score {
    font-size: 24px;
    color: #e85d75;
    font-weight: bold;
  }

  #game-area {
    position: relative;
    height: calc(100vh - 80px);
    overflow: hidden;
  }

  /* 인트로 화면 */
  #intro {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    z-index: 50;
  }

  #intro h2 {
    font-size: 48px;
    color: #5b4a9e;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.8);
  }

  #intro p {
    font-size: 24px;
    color: #666;
  }

  .start-btn {
    font-size: 32px;
    padding: 20px 60px;
    background: linear-gradient(135deg, #7c5cbf, #e85d75);
    color: white;
    border: none;
    border-radius: 50px;
    cursor: none;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 8px 25px rgba(124,92,191,0.3);
  }

  .start-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 12px 35px rgba(124,92,191,0.5);
  }

  /* 스테이지 안내 */
  #stage-intro {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 40;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(5px);
  }

  #stage-intro.visible {
    display: flex;
    animation: fadeIn 0.5s;
  }

  #stage-intro h2 {
    font-size: 44px;
    color: #5b4a9e;
  }

  #stage-intro .stage-emoji {
    font-size: 80px;
    animation: bounce 1s infinite;
  }

  #stage-intro p {
    font-size: 26px;
    color: #555;
    text-align: center;
    line-height: 1.6;
  }

  /* 클릭 타겟 */
  .click-target {
    position: absolute;
    font-size: 70px;
    cursor: none;
    transition: transform 0.1s;
    animation: appear 0.3s ease-out;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
    z-index: 10;
  }

  .click-target:hover {
    transform: scale(1.15);
    cursor: none;
  }

  /* 더블클릭 알 */
  .egg-target {
    position: absolute;
    font-size: 80px;
    cursor: none;
    animation: wobble 2s infinite;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
    z-index: 10;
  }

  .egg-target:hover {
    animation: wobble 0.5s infinite;
  }

  /* 부화 효과 */
  .hatch-effect {
    position: absolute;
    font-size: 80px;
    z-index: 15;
    animation: hatchPop 0.8s ease-out forwards;
    pointer-events: none;
  }

  /* 드래그 아이템 */
  .drag-item {
    position: absolute;
    font-size: 64px;
    cursor: none;
    z-index: 20;
    transition: transform 0.1s;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.2));
  }

  .drag-item:hover {
    transform: scale(1.1);
  }

  .drag-item.dragging {
    cursor: none;
    transform: scale(1.2);
    z-index: 30;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
  }

  /* 드래그 드롭 영역 */
  .drop-zone {
    position: absolute;
    width: 120px;
    height: 120px;
    border: 4px dashed #7c5cbf;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 50px;
    opacity: 0.4;
    background: rgba(124,92,191,0.08);
    transition: all 0.3s;
  }

  .drop-zone.highlight {
    border-color: #4ecdc4;
    background: rgba(78,205,196,0.15);
    opacity: 0.8;
    transform: scale(1.1);
  }

  .drop-zone.matched {
    border-style: solid;
    border-color: #4ecdc4;
    background: rgba(78,205,196,0.2);
    opacity: 1;
    animation: successPulse 0.5s;
  }

  /* 팡 이펙트 */
  .pop-effect {
    position: absolute;
    pointer-events: none;
    font-size: 40px;
    font-weight: bold;
    color: #e85d75;
    z-index: 50;
    animation: popUp 0.7s ease-out forwards;
  }

  /* 별 파티클 */
  .particle {
    position: absolute;
    pointer-events: none;
    font-size: 24px;
    z-index: 45;
    animation: particleFly 0.8s ease-out forwards;
  }

  /* 완료 화면 */
  #complete {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 50;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
  }

  #complete.visible {
    display: flex;
    animation: fadeIn 0.5s;
  }

  #complete h2 {
    font-size: 52px;
    color: #5b4a9e;
  }

  #complete .trophy {
    font-size: 100px;
    animation: bounce 1.5s infinite;
  }

  /* 프로그레스 바 */
  #progress-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 8px;
    background: linear-gradient(90deg, #7c5cbf, #e85d75, #4ecdc4);
    transition: width 0.4s ease;
    border-radius: 0 4px 0 0;
    z-index: 100;
  }

  /* 애니메이션 */
  @keyframes appear {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  @keyframes popUp {
    0% { transform: scale(0.5) translateY(0); opacity: 1; }
    100% { transform: scale(1.5) translateY(-60px); opacity: 0; }
  }

  @keyframes particleFly {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  @keyframes wobble {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-5deg); }
    75% { transform: rotate(5deg); }
  }

  @keyframes hatchPop {
    0% { transform: scale(1); opacity: 1; }
    30% { transform: scale(1.4); }
    100% { transform: scale(1.2); opacity: 1; }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes successPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  @keyframes confetti {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  .confetti {
    position: fixed;
    top: -20px;
    font-size: 30px;
    z-index: 200;
    pointer-events: none;
    animation: confetti 3s ease-in forwards;
  }
</style>
</head>
<body>

<!-- 큰 커스텀 커서 -->
<div id="custom-cursor">
  <!-- 기본: 분홍 화살표 -->
  <svg class="cursor-default" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M4 4L14 28L17 18L28 14L4 4Z" fill="#FF6B9D" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
  </svg>
  <!-- 호버: 손가락 이모지 -->
  <span class="cursor-pointer" style="display:none">👆</span>
  <!-- 드래그: 주먹 이모지 -->
  <span class="cursor-grab" style="display:none">✊</span>
</div>

<div id="header">
  <h1>🖱️ 마우스 연습</h1>
  <div class="stage-indicator">
    <div class="stage-dot" id="dot1">1</div>
    <div class="stage-dot" id="dot2">2</div>
    <div class="stage-dot" id="dot3">3</div>
  </div>
  <div id="score">⭐ 0</div>
</div>

<div id="game-area">
  <div id="progress-bar" style="width: 0%"></div>

  <!-- 인트로 화면 -->
  <div id="intro">
    <h2>🐭 마우스 연습 게임</h2>
    <p>마우스 사용법을 재미있게 배워보자!</p>
    <button class="start-btn" onclick="startGame()">🎮 시작하기!</button>
  </div>

  <!-- 스테이지 안내 -->
  <div id="stage-intro">
    <div class="stage-emoji" id="stage-emoji">👆</div>
    <h2 id="stage-title"></h2>
    <p id="stage-desc"></p>
    <button class="start-btn" onclick="startStage()">준비 됐어!</button>
  </div>

  <!-- 완료 화면 -->
  <div id="complete">
    <div class="trophy">🏆</div>
    <h2>대단해! 모두 완료!</h2>
    <p style="font-size:24px;color:#666">마우스 사용을 아주 잘 배웠어! 👏</p>
    <button class="start-btn" onclick="resetGame()">🔄 다시 하기</button>
  </div>
</div>

<script>
// ===== 게임 상태 =====
let currentStage = 0;
let score = 0;
let stageScore = 0;
let audioCtx = null;

const STAGE_GOALS = [10, 10, 5];
const CLICK_EMOJIS = ['🐱', '🐶', '🐰', '🦊', '🐻', '🐼', '🐸', '🦁', '🐯', '🐮', '🐷', '🐵', '🦄', '🐝', '🐞', '🦋', '⭐', '🌟', '💫', '🌈'];
const HATCH_ANIMALS = ['🐣', '🐥', '🐤', '🐦', '🦜', '🦆', '🦅', '🐧', '🦉', '🦩'];
const DRAG_PAIRS = [
  { item: '🍎', label: '사과' },
  { item: '🍌', label: '바나나' },
  { item: '🍇', label: '포도' },
  { item: '🍓', label: '딸기' },
  { item: '🍊', label: '오렌지' },
  { item: '🐱', label: '고양이' },
  { item: '🐶', label: '강아지' },
  { item: '🌸', label: '꽃' },
];

const STAGES = [
  { emoji: '👆', title: '1단계: 클릭!', desc: '동물이 나타나면\n클릭해서 잡아보자!' },
  { emoji: '👆👆', title: '2단계: 더블클릭!', desc: '알을 빠르게 두 번 클릭해서\n동물을 꺼내보자!' },
  { emoji: '✋', title: '3단계: 끌어다 놓기!', desc: '과일을 잡아서\n맞는 자리에 놓아보자!' },
];

// ===== 오디오 =====
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(freq, duration, type = 'sine') {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playClickSound() {
  playSound(800, 0.15);
  setTimeout(() => playSound(1200, 0.1), 80);
}

function playHatchSound() {
  playSound(400, 0.1);
  setTimeout(() => playSound(600, 0.1), 100);
  setTimeout(() => playSound(900, 0.2), 200);
}

function playDropSound() {
  playSound(500, 0.1);
  setTimeout(() => playSound(700, 0.15), 100);
  setTimeout(() => playSound(1000, 0.2), 200);
}

function playCompleteSound() {
  [0, 100, 200, 300, 400].forEach((delay, i) => {
    setTimeout(() => playSound(600 + i * 100, 0.2), delay);
  });
}

// ===== 유틸리티 =====
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[rand(0, arr.length - 1)]; }

function getGameArea() {
  const area = document.getElementById('game-area');
  return { width: area.clientWidth, height: area.clientHeight };
}

function clearGameObjects() {
  document.querySelectorAll('.click-target, .egg-target, .drag-item, .drop-zone, .pop-effect, .particle, .hatch-effect')
    .forEach(el => el.remove());
}

function updateScore() {
  document.getElementById('score').textContent = `⭐ ${score}`;
}

function updateProgress() {
  const pct = (stageScore / STAGE_GOALS[currentStage]) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateStageDots() {
  for (let i = 0; i < 3; i++) {
    const dot = document.getElementById('dot' + (i + 1));
    dot.className = 'stage-dot';
    if (i < currentStage) dot.classList.add('done');
    if (i === currentStage) dot.classList.add('active');
  }
}

// ===== 파티클 이펙트 =====
function spawnParticles(x, y) {
  const emojis = ['✨', '⭐', '💥', '🌟', '💫'];
  for (let i = 0; i < 6; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = pick(emojis);
    const angle = (Math.PI * 2 / 6) * i;
    const dist = rand(50, 120);
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    document.getElementById('game-area').appendChild(p);
    setTimeout(() => p.remove(), 800);
  }
}

function showPopText(x, y, text) {
  const el = document.createElement('div');
  el.className = 'pop-effect';
  el.textContent = text;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  document.getElementById('game-area').appendChild(el);
  setTimeout(() => el.remove(), 700);
}

function showConfetti() {
  const emojis = ['🎉', '🎊', '⭐', '🌟', '💫', '🎈', '🎀', '🌈'];
  for (let i = 0; i < 20; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.textContent = pick(emojis);
      c.style.left = rand(5, 95) + 'vw';
      c.style.animationDuration = rand(2, 4) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4000);
    }, i * 100);
  }
}

// ===== 게임 흐름 =====
function startGame() {
  initAudio();
  document.getElementById('intro').style.display = 'none';
  currentStage = 0;
  score = 0;
  stageScore = 0;
  updateScore();
  updateStageDots();
  showStageIntro();
}

function showStageIntro() {
  const info = STAGES[currentStage];
  document.getElementById('stage-emoji').textContent = info.emoji;
  document.getElementById('stage-title').textContent = info.title;
  document.getElementById('stage-desc').textContent = info.desc;
  const el = document.getElementById('stage-intro');
  el.classList.add('visible');
  updateStageDots();
}

function startStage() {
  document.getElementById('stage-intro').classList.remove('visible');
  stageScore = 0;
  updateProgress();
  clearGameObjects();
  if (currentStage === 0) startClickStage();
  else if (currentStage === 1) startDoubleClickStage();
  else if (currentStage === 2) startDragStage();
}

function stageComplete() {
  playCompleteSound();
  showConfetti();
  clearGameObjects();
  currentStage++;
  stageScore = 0;
  document.getElementById('progress-bar').style.width = '0%';
  if (currentStage >= 3) {
    setTimeout(() => {
      document.getElementById('complete').classList.add('visible');
      updateStageDots();
    }, 1000);
  } else {
    setTimeout(() => showStageIntro(), 1000);
  }
}

function resetGame() {
  document.getElementById('complete').classList.remove('visible');
  clearGameObjects();
  currentStage = 0;
  score = 0;
  stageScore = 0;
  updateScore();
  updateProgress();
  updateStageDots();
  document.getElementById('intro').style.display = '';
}

// ===== 1단계: 클릭 =====
function startClickStage() {
  spawnClickTarget();
}

function spawnClickTarget() {
  if (stageScore >= STAGE_GOALS[0]) return;
  const { width, height } = getGameArea();
  const el = document.createElement('div');
  el.className = 'click-target';
  el.textContent = pick(CLICK_EMOJIS);
  const x = rand(40, width - 120);
  const y = rand(40, height - 120);
  el.style.left = x + 'px';
  el.style.top = y + 'px';

  el.addEventListener('click', function handler(e) {
    e.stopPropagation();
    playClickSound();
    const rect = el.getBoundingClientRect();
    const area = document.getElementById('game-area').getBoundingClientRect();
    const cx = rect.left + rect.width / 2 - area.left;
    const cy = rect.top + rect.height / 2 - area.top;
    spawnParticles(cx, cy);
    showPopText(cx - 20, cy - 30, '팡!');
    el.remove();
    score++;
    stageScore++;
    updateScore();
    updateProgress();
    if (stageScore >= STAGE_GOALS[0]) {
      stageComplete();
    } else {
      setTimeout(spawnClickTarget, 300);
    }
  });

  document.getElementById('game-area').appendChild(el);
}

// ===== 2단계: 더블클릭 =====
function startDoubleClickStage() {
  spawnEggTarget();
}

function spawnEggTarget() {
  if (stageScore >= STAGE_GOALS[1]) return;
  const { width, height } = getGameArea();
  const el = document.createElement('div');
  el.className = 'egg-target';
  el.textContent = '🥚';
  const x = rand(40, width - 120);
  const y = rand(40, height - 120);
  el.style.left = x + 'px';
  el.style.top = y + 'px';

  el.addEventListener('dblclick', function handler(e) {
    e.stopPropagation();
    e.preventDefault();
    playHatchSound();
    const rect = el.getBoundingClientRect();
    const area = document.getElementById('game-area').getBoundingClientRect();
    const cx = rect.left + rect.width / 2 - area.left;
    const cy = rect.top + rect.height / 2 - area.top;

    // 부화 애니메이션
    el.remove();
    const animal = document.createElement('div');
    animal.className = 'hatch-effect';
    animal.textContent = pick(HATCH_ANIMALS);
    animal.style.left = (cx - 40) + 'px';
    animal.style.top = (cy - 40) + 'px';
    document.getElementById('game-area').appendChild(animal);

    spawnParticles(cx, cy);
    showPopText(cx - 30, cy - 40, '짜잔!');

    setTimeout(() => animal.remove(), 800);

    score++;
    stageScore++;
    updateScore();
    updateProgress();
    if (stageScore >= STAGE_GOALS[1]) {
      stageComplete();
    } else {
      setTimeout(spawnEggTarget, 500);
    }
  });

  document.getElementById('game-area').appendChild(el);
}

// ===== 3단계: 드래그 =====
let dragState = null;

function startDragStage() {
  spawnDragPuzzle();
}

function spawnDragPuzzle() {
  if (stageScore >= STAGE_GOALS[2]) return;

  const { width, height } = getGameArea();
  const pair = DRAG_PAIRS[stageScore % DRAG_PAIRS.length];

  // 드롭 영역 (오른쪽에 배치)
  const zone = document.createElement('div');
  zone.className = 'drop-zone';
  zone.textContent = pair.item;
  zone.dataset.emoji = pair.item;
  const zx = rand(width / 2 + 40, width - 160);
  const zy = rand(60, height - 180);
  zone.style.left = zx + 'px';
  zone.style.top = zy + 'px';
  document.getElementById('game-area').appendChild(zone);

  // 드래그 아이템 (왼쪽에 배치)
  const item = document.createElement('div');
  item.className = 'drag-item';
  item.textContent = pair.item;
  item.dataset.emoji = pair.item;
  const ix = rand(40, width / 2 - 100);
  const iy = rand(60, height - 140);
  item.style.left = ix + 'px';
  item.style.top = iy + 'px';

  // 마우스 드래그
  item.addEventListener('mousedown', (e) => {
    e.preventDefault();
    startDrag(item, e.clientX, e.clientY);
  });

  // 터치 드래그
  item.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    startDrag(item, t.clientX, t.clientY);
  }, { passive: false });

  document.getElementById('game-area').appendChild(item);
}

function startDrag(item, startX, startY) {
  const area = document.getElementById('game-area').getBoundingClientRect();
  const rect = item.getBoundingClientRect();
  const offsetX = startX - rect.left;
  const offsetY = startY - rect.top;

  item.classList.add('dragging');
  dragState = { item, offsetX, offsetY, areaLeft: area.left, areaTop: area.top };
}

document.addEventListener('mousemove', (e) => {
  if (!dragState) return;
  moveDrag(e.clientX, e.clientY);
});

document.addEventListener('touchmove', (e) => {
  if (!dragState) return;
  const t = e.touches[0];
  moveDrag(t.clientX, t.clientY);
}, { passive: false });

function moveDrag(clientX, clientY) {
  if (!dragState) return;
  const { item, offsetX, offsetY, areaLeft, areaTop } = dragState;
  item.style.left = (clientX - areaLeft - offsetX) + 'px';
  item.style.top = (clientY - areaTop - offsetY) + 'px';

  // 드롭 영역 하이라이트
  document.querySelectorAll('.drop-zone').forEach(zone => {
    const zr = zone.getBoundingClientRect();
    const cx = clientX;
    const cy = clientY;
    if (cx > zr.left && cx < zr.right && cy > zr.top && cy < zr.bottom) {
      zone.classList.add('highlight');
    } else {
      zone.classList.remove('highlight');
    }
  });
}

document.addEventListener('mouseup', (e) => {
  if (!dragState) return;
  endDrag(e.clientX, e.clientY);
});

document.addEventListener('touchend', (e) => {
  if (!dragState) return;
  const t = e.changedTouches[0];
  endDrag(t.clientX, t.clientY);
});

function endDrag(clientX, clientY) {
  if (!dragState) return;
  const { item } = dragState;
  item.classList.remove('dragging');

  let matched = false;
  document.querySelectorAll('.drop-zone').forEach(zone => {
    zone.classList.remove('highlight');
    const zr = zone.getBoundingClientRect();
    if (clientX > zr.left && clientX < zr.right && clientY > zr.top && clientY < zr.bottom) {
      if (item.dataset.emoji === zone.dataset.emoji) {
        matched = true;
        playDropSound();
        zone.classList.add('matched');

        const area = document.getElementById('game-area').getBoundingClientRect();
        const cx = zr.left + zr.width / 2 - area.left;
        const cy = zr.top + zr.height / 2 - area.top;
        spawnParticles(cx, cy);
        showPopText(cx - 30, cy - 40, '잘했어!');

        item.remove();
        score++;
        stageScore++;
        updateScore();
        updateProgress();

        setTimeout(() => {
          zone.remove();
          if (stageScore >= STAGE_GOALS[2]) {
            stageComplete();
          } else {
            spawnDragPuzzle();
          }
        }, 600);
      }
    }
  });

  dragState = null;
}

// 텍스트 선택 및 컨텍스트 메뉴 방지
document.addEventListener('contextmenu', e => e.preventDefault());

// ===== 큰 커스텀 커서 =====
const customCursor = document.getElementById('custom-cursor');
const cursorDefault = customCursor.querySelector('.cursor-default');
const cursorPointer = customCursor.querySelector('.cursor-pointer');
const cursorGrab = customCursor.querySelector('.cursor-grab');
let cursorMode = '';

function setCursorMode(mode) {
  if (cursorMode === mode) return;
  cursorMode = mode;
  cursorDefault.style.display = mode === 'default' ? '' : 'none';
  cursorPointer.style.display = mode === 'pointer' ? '' : 'none';
  cursorGrab.style.display = mode === 'grab' ? '' : 'none';
  customCursor.className = 'mode-' + mode;
}

setCursorMode('default');

document.addEventListener('mousemove', (e) => {
  customCursor.style.left = e.clientX + 'px';
  customCursor.style.top = e.clientY + 'px';

  // 드래그 중이면 grab 유지
  if (dragState) {
    setCursorMode('grab');
    return;
  }

  // 호버 대상 체크
  const el = document.elementFromPoint(e.clientX, e.clientY);
  if (el && (el.classList.contains('click-target') || el.classList.contains('egg-target') || el.classList.contains('drag-item'))) {
    setCursorMode('pointer');
  } else {
    setCursorMode('default');
  }
});

document.addEventListener('mousedown', () => {
  customCursor.style.scale = '0.85';
});
document.addEventListener('mouseup', () => {
  customCursor.style.scale = '1';
  if (!dragState) setCursorMode('default');
});
</script>
</body>
