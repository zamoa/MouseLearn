<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마우스 연습 게임</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐭</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    cursor: none;
  }

  #custom-cursor {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    transition: width 0.2s, height 0.2s, scale 0.1s;
    filter: drop-shadow(2px 3px 4px rgba(0,0,0,0.3));
  }

  #custom-cursor svg {
    width: 100%;
    height: 100%;
  }

  #custom-cursor span {
    font-size: 42px;
    line-height: 1;
  }

  /* 기본 화살표 */
  #custom-cursor.mode-default {
    width: 44px;
    height: 44px;
    transform: translate(-6px, -3px);
  }

  /* 호버: 손가락 이모지 */
  #custom-cursor.mode-pointer {
    transform: translate(-12px, -5px);
    animation: cursorBounce 0.3s ease-out;
  }

  #custom-cursor.mode-pointer span {
    font-size: 42px;
  }

  /* 드래그: 주먹 이모지 */
  #custom-cursor.mode-grab {
    transform: translate(-14px, -8px);
    animation: cursorBounce 0.3s ease-out;
  }

  #custom-cursor.mode-grab span {
    font-size: 52px;
  }

  @keyframes cursorBounce {
    0% { scale: 0.7; }
    60% { scale: 1.15; }
    100% { scale: 1; }
  }

  #header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 32px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    border-bottom: 3px solid rgba(255,255,255,0.5);
    z-index: 100;
    position: relative;
  }

  #header h1 {
    font-size: 28px;
    color: #5b4a9e;
  }

  .stage-indicator {
    display: flex;
    gap: 8px;
  }

  .stage-dot {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #ddd;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
    color: #999;
    transition: all 0.3s;
  }

  .stage-dot:hover {
    transform: scale(1.15);
    background: #c9b8f0;
    color: #5b4a9e;
  }

  .stage-dot.done:hover {
    background: #6fdcd4;
    color: white;
  }

  .stage-dot.active:hover {
    transform: scale(1.2);
    background: #7c5cbf;
    color: white;
  }

  .stage-dot.active {
    background: #7c5cbf;
    color: white;
    transform: scale(1.2);
    box-shadow: 0 4px 15px rgba(124,92,191,0.4);
  }

  .stage-dot.done {
    background: #4ecdc4;
    color: white;
  }

  #score {
    font-size: 24px;
    color: #e85d75;
    font-weight: bold;
  }

  #game-area {
    position: relative;
    height: calc(100vh - 80px);
    overflow: hidden;
  }

  /* 인트로 화면 */
  #intro {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    z-index: 50;
  }

  #intro h2 {
    font-size: 48px;
    color: #5b4a9e;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.8);
  }

  #intro p {
    font-size: 24px;
    color: #666;
  }

  .start-btn {
    font-size: 32px;
    padding: 20px 60px;
    background: linear-gradient(135deg, #7c5cbf, #e85d75);
    color: white;
    border: none;
    border-radius: 50px;
    cursor: none;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 8px 25px rgba(124,92,191,0.3);
  }

  .start-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 12px 35px rgba(124,92,191,0.5);
  }

  /* 스테이지 안내 */
  #stage-intro {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 40;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(5px);
  }

  #stage-intro.visible {
    display: flex;
    animation: fadeIn 0.5s;
  }

  #stage-intro h2 {
    font-size: 44px;
    color: #5b4a9e;
  }

  #stage-intro .stage-emoji {
    font-size: 80px;
    animation: bounce 1s infinite;
  }

  #stage-intro p {
    font-size: 26px;
    color: #555;
    text-align: center;
    line-height: 1.6;
  }

  /* 클릭 타겟 */
  .click-target {
    position: absolute;
    font-size: 70px;
    cursor: none;
    transition: transform 0.1s;
    animation: appear 0.3s ease-out;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
    z-index: 10;
  }

  .click-target:hover {
    transform: scale(1.15);
    cursor: none;
  }

  /* 더블클릭 알 */
  .egg-target {
    position: absolute;
    font-size: 80px;
    cursor: none;
    animation: wobble 2s infinite;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
    z-index: 10;
  }

  .egg-target:hover {
    animation: wobble 0.5s infinite;
  }

  /* 부화 효과 */
  .hatch-effect {
    position: absolute;
    font-size: 80px;
    z-index: 15;
    animation: hatchPop 0.8s ease-out forwards;
    pointer-events: none;
  }

  /* 드래그 아이템 */
  .drag-item {
    position: absolute;
    font-size: 64px;
    cursor: none;
    z-index: 20;
    transition: transform 0.1s;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.2));
  }

  .drag-item:hover {
    transform: scale(1.1);
  }

  .drag-item.dragging {
    cursor: none;
    transform: scale(1.2);
    z-index: 30;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
  }

  /* 드래그 드롭 영역 */
  .drop-zone {
    position: absolute;
    width: 120px;
    height: 120px;
    border: 4px dashed #7c5cbf;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 50px;
    opacity: 0.4;
    background: rgba(124,92,191,0.08);
    transition: all 0.3s;
  }

  .drop-zone.highlight {
    border-color: #4ecdc4;
    background: rgba(78,205,196,0.15);
    opacity: 0.8;
    transform: scale(1.1);
  }

  .drop-zone.matched {
    border-style: solid;
    border-color: #4ecdc4;
    background: rgba(78,205,196,0.2);
    opacity: 1;
    animation: successPulse 0.5s;
  }

  /* 팡 이펙트 */
  .pop-effect {
    position: absolute;
    pointer-events: none;
    font-size: 40px;
    font-weight: bold;
    color: #e85d75;
    z-index: 50;
    animation: popUp 0.7s ease-out forwards;
  }

  /* 별 파티클 */
  .particle {
    position: absolute;
    pointer-events: none;
    font-size: 24px;
    z-index: 45;
    animation: particleFly 0.8s ease-out forwards;
  }

  /* 완료 화면 */
  #complete {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 50;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
  }

  #complete.visible {
    display: flex;
    animation: fadeIn 0.5s;
  }

  #complete h2 {
    font-size: 52px;
    color: #5b4a9e;
  }

  #complete .trophy {
    font-size: 100px;
    animation: bounce 1.5s infinite;
  }

  /* 프로그레스 바 */
  #progress-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 8px;
    background: linear-gradient(90deg, #7c5cbf, #e85d75, #4ecdc4);
    transition: width 0.4s ease;
    border-radius: 0 4px 0 0;
    z-index: 100;
  }

  /* 애니메이션 */
  @keyframes appear {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  @keyframes popUp {
    0% { transform: scale(0.5) translateY(0); opacity: 1; }
    100% { transform: scale(1.5) translateY(-60px); opacity: 0; }
  }

  @keyframes particleFly {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  @keyframes wobble {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-5deg); }
    75% { transform: rotate(5deg); }
  }

  @keyframes hatchPop {
    0% { transform: scale(1); opacity: 1; }
    30% { transform: scale(1.4); }
    100% { transform: scale(1.2); opacity: 1; }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes successPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  @keyframes confetti {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  .confetti {
    position: fixed;
    top: -20px;
    font-size: 30px;
    z-index: 200;
    pointer-events: none;
    animation: confetti 3s ease-in forwards;
  }


  /* 글자 찾기 (알파벳 / 한글) */
  #word-prompt {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    align-items: center;
    gap: 14px;
    padding: 10px 26px;
    background: rgba(255,255,255,0.92);
    border: 3px solid #7c5cbf;
    border-radius: 40px;
    box-shadow: 0 6px 20px rgba(124,92,191,0.25);
    z-index: 60;
    animation: appear 0.3s ease-out;
    white-space: nowrap;
  }

  #word-prompt.visible {
    display: flex;
  }

  #word-prompt .prompt-emoji {
    font-size: 44px;
    line-height: 1;
  }

  #word-prompt .prompt-text {
    font-size: 22px;
    color: #666;
  }

  #word-prompt .prompt-word {
    font-size: 40px;
    font-weight: bold;
    color: #5b4a9e;
    letter-spacing: 2px;
  }

  #word-prompt .prompt-word.multi {
    font-size: 34px;
  }

  .word-target {
    position: absolute;
    min-width: 84px;
    height: 84px;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    font-weight: bold;
    color: white;
    border-radius: 22px;
    border: 4px solid rgba(255,255,255,0.8);
    box-shadow: 0 6px 16px rgba(0,0,0,0.18);
    cursor: none;
    z-index: 10;
    transition: transform 0.1s;
    animation: appear 0.3s ease-out;
    letter-spacing: 1px;
  }

  .word-target.multi {
    font-size: 34px;
  }

  .word-target:hover {
    transform: scale(1.12);
    cursor: none;
  }

  /* 더블클릭으로 단어 ↔ 그림 토글 */
  .word-target.pic {
    font-size: 56px;
    letter-spacing: 0;
    animation: flip 0.35s ease-out;
  }

  .word-target.flip-back {
    animation: flip 0.35s ease-out;
  }

  @keyframes flip {
    0% { transform: scaleX(0); }
    100% { transform: scaleX(1); }
  }

  .word-target.wrong {
    animation: shake 0.4s;
  }

  .word-target.correct {
    animation: successPulse 0.5s;
    border-color: #ffe66d;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }


  /* ===== 8단계: 짝 맞추기 (메모리) ===== */
  .mem-grid {
    position: absolute;
    display: grid;
    z-index: 10;
  }

  .mem-card {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    background: linear-gradient(135deg, #7c5cbf, #9d7fe0);
    border: 4px solid rgba(255,255,255,0.85);
    box-shadow: 0 6px 14px rgba(0,0,0,0.18);
    color: rgba(255,255,255,0.9);
    font-weight: bold;
    cursor: none;
    transition: transform 0.25s, background 0.25s;
    animation: appear 0.3s ease-out both;
    text-align: center;
    padding: 4px;
    word-break: keep-all;
  }

  .mem-card:hover {
    transform: scale(1.06);
  }

  .mem-card.open {
    background: #fff;
    color: #5b4a9e;
    animation: flip 0.3s ease-out;
  }

  .mem-card.matched {
    background: #e3fbf8;
    border-color: #4ecdc4;
    color: #2a9d95;
    animation: successPulse 0.5s;
  }

  .mem-card.nudge {
    animation: wobble 0.4s;
  }

  /* ===== 9단계: 두더지 잡기 ===== */
  .mole-board {
    position: absolute;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    z-index: 10;
  }

  .mole-hole {
    position: relative;
    overflow: hidden;
  }

  /* 구멍(어두운 타원) */
  .mole-hole::before {
    content: '';
    position: absolute;
    left: 10%;
    right: 10%;
    bottom: 4%;
    height: 30%;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 35%, #3b2614 0%, #5a3e22 70%);
    box-shadow: inset 0 6px 10px rgba(0,0,0,0.35);
    z-index: 1;
  }

  /* 구멍 앞쪽 흙 턱 */
  .mole-hole::after {
    content: '';
    position: absolute;
    left: 10%;
    right: 10%;
    bottom: 0;
    height: 14%;
    border-radius: 50% 50% 30% 30%;
    background: #8a6440;
    z-index: 3;
    pointer-events: none;
  }

  .mole {
    position: absolute;
    left: 50%;
    bottom: 10%;
    transform: translate(-50%, 150%);
    transition: transform 0.35s ease-out;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: none;
    z-index: 2;
  }

  .mole.up {
    transform: translate(-50%, 0);
  }

  .mole.bonk {
    animation: shake 0.3s;
  }

  .mole-letter {
    background: #fff;
    color: #5b4a9e;
    border: 3px solid #7c5cbf;
    border-radius: 14px;
    padding: 2px 12px;
    font-weight: bold;
    font-size: 30px;
    line-height: 1.2;
    margin-bottom: -6px;
    pointer-events: none;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
  }

  .mole-face {
    font-size: 64px;
    line-height: 1;
    pointer-events: none;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
  }

  /* ===== 10단계: 낚시 ===== */
  .pond {
    position: absolute;
    border-radius: 40px;
    background: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.35), transparent 50%),
                linear-gradient(180deg, #7fd3f7 0%, #3aa9e0 100%);
    border: 6px solid #2b8bc0;
    box-shadow: inset 0 8px 30px rgba(0,0,0,0.15);
    z-index: 5;
  }

  .fish {
    display: flex;
    align-items: center;
    gap: 2px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25));
  }

  .fish-emoji {
    font-size: 56px;
    line-height: 1;
    display: inline-block;
  }

  .fish-letter {
    background: #fff;
    color: #2b6fa3;
    border: 3px solid #2b8bc0;
    border-radius: 12px;
    padding: 2px 10px;
    font-size: 28px;
    font-weight: bold;
    line-height: 1.2;
  }

  .basket {
    position: absolute;
    width: 130px;
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 90px;
    border-radius: 30px;
    border: 4px dashed #c58a3a;
    background: rgba(255,214,150,0.35);
    transition: transform 0.2s, background 0.2s;
    z-index: 6;
  }

  .basket.highlight {
    transform: scale(1.12);
    background: rgba(255,214,150,0.7);
  }

  .basket.bonk {
    animation: shake 0.4s;
  }

  .basket.matched {
    animation: successPulse 0.5s;
  }

  @media (max-width: 900px) {
    #header h1 {
      font-size: 22px;
    }
    .stage-dot {
      width: 30px;
      height: 30px;
      font-size: 15px;
    }
    .stage-indicator {
      gap: 6px;
    }
  }

  /* ===== 모바일 반응형 ===== */
  @media (max-width: 600px) {
    #header {
      padding: 10px 16px;
    }
    #header h1 {
      font-size: 18px;
    }
    #header h1 .title-text {
      display: none;
    }
    .stage-dot {
      width: 24px;
      height: 24px;
      font-size: 12px;
    }
    .stage-indicator {
      gap: 3px;
    }
    .mole-letter {
      font-size: 20px;
      padding: 1px 8px;
    }
    .mole-face {
      font-size: 44px;
    }
    .fish-emoji {
      font-size: 40px;
    }
    .fish-letter {
      font-size: 20px;
      padding: 1px 7px;
    }
    .basket {
      width: 84px;
      height: 84px;
      font-size: 56px;
    }
    #score {
      font-size: 18px;
    }
    #intro h2 {
      font-size: 28px;
    }
    #intro p {
      font-size: 16px;
    }
    .start-btn {
      font-size: 22px;
      padding: 14px 40px;
    }
    #stage-intro h2 {
      font-size: 28px;
    }
    #stage-intro .stage-emoji {
      font-size: 50px;
    }
    #stage-intro p {
      font-size: 18px;
      padding: 0 20px;
    }
    .click-target {
      font-size: 50px;
    }
    .egg-target {
      font-size: 60px;
    }
    .drag-item {
      font-size: 48px;
    }
    .drop-zone {
      width: 90px;
      height: 90px;
      font-size: 38px;
    }
    #complete h2 {
      font-size: 32px;
    }
    #complete .trophy {
      font-size: 70px;
    }
    #complete p {
      font-size: 18px;
    }
    .pop-effect {
      font-size: 28px;
    }
    #word-prompt {
      top: 8px;
      gap: 8px;
      padding: 6px 14px;
      white-space: normal;
      max-width: calc(100% - 24px);
      flex-wrap: wrap;
      justify-content: center;
      text-align: center;
    }
    #word-prompt .prompt-emoji {
      font-size: 28px;
    }
    #word-prompt .prompt-text {
      font-size: 14px;
    }
    #word-prompt .prompt-word {
      font-size: 26px;
    }
    #word-prompt .prompt-word.multi {
      font-size: 22px;
    }
    .word-target {
      min-width: 60px;
      height: 60px;
      padding: 0 12px;
      font-size: 30px;
      border-radius: 16px;
    }
    .word-target.multi {
      font-size: 22px;
    }
    .word-target.pic {
      font-size: 38px;
    }
    /* 모바일에서는 커스텀 커서 숨김 (터치 사용) */
    #custom-cursor {
      display: none;
    }
    body {
      cursor: auto;
    }
    .click-target, .egg-target, .drag-item, .word-target, .stage-dot, .mem-card, .mole, .start-btn, .click-target:hover, .word-target:hover {
      cursor: auto;
    }
  }
</style>
</head>
<body>

<!-- 큰 커스텀 커서 -->
<div id="custom-cursor">
  <!-- 기본: 분홍 화살표 -->
  <svg class="cursor-default" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M4 4L14 28L17 18L28 14L4 4Z" fill="#FF6B9D" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
  </svg>
  <!-- 호버: 손가락 이모지 -->
  <span class="cursor-pointer" style="display:none">👆</span>
  <!-- 드래그: 주먹 이모지 -->
  <span class="cursor-grab" style="display:none">✊</span>
</div>

<div id="header">
  <h1>🖱️<span class="title-text"> 마우스 연습</span></h1>
  <div class="stage-indicator">

// ===== 오디오 =====
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(freq, duration, type = 'sine') {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playClickSound() {
  playSound(800, 0.15);
  setTimeout(() => playSound(1200, 0.1), 80);
}

function playHatchSound() {
  playSound(400, 0.1);
  setTimeout(() => playSound(600, 0.1), 100);
  setTimeout(() => playSound(900, 0.2), 200);
}

function playDropSound() {
  playSound(500, 0.1);
  setTimeout(() => playSound(700, 0.15), 100);
  setTimeout(() => playSound(1000, 0.2), 200);
}

function playWrongSound() {
  playSound(220, 0.15, 'triangle');
  setTimeout(() => playSound(180, 0.2, 'triangle'), 120);
}

function playCompleteSound() {
  [0, 100, 200, 300, 400].forEach((delay, i) => {
    setTimeout(() => playSound(600 + i * 100, 0.2), delay);
  });
}

// ===== 유틸리티 =====
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[rand(0, arr.length - 1)]; }

function getGameArea() {
  const area = document.getElementById('game-area');
  return { width: area.clientWidth, height: area.clientHeight };
}

function clearGameObjects() {
  stopStageLoops();
  document.querySelectorAll('.click-target, .egg-target, .drag-item, .drop-zone, .pop-effect, .particle, .hatch-effect, .word-target, .mem-grid, .mole-board, .pond, .basket')
    .forEach(el => el.remove());
  document.getElementById('word-prompt').classList.remove('visible');
}

// 스테이지별 타이머/애니메이션 루프 관리 (스테이지 이동 시 정리)
const stageTimers = new Set();
let stageRaf = null;
let dropHandler = null;   // 드래그 놓기 커스텀 처리 (낚시 등)

function later(fn, ms) {
  const id = setTimeout(() => { stageTimers.delete(id); fn(); }, ms);
  stageTimers.add(id);
  return id;
}

function stopStageLoops() {
  stageTimers.forEach(id => clearTimeout(id));
  stageTimers.clear();
  if (stageRaf) { cancelAnimationFrame(stageRaf); stageRaf = null; }
  dropHandler = null;
  dragState = null;
}

function showPrompt(word, emoji, text) {
  const prompt = document.getElementById('word-prompt');
  const pe = document.getElementById('prompt-emoji');
  pe.textContent = emoji || '';
  pe.style.display = emoji ? '' : 'none';
  const pw = document.getElementById('prompt-word');
  pw.textContent = word || '';
  pw.style.display = word ? '' : 'none';
  pw.classList.toggle('multi', (word || '').length > 1);
  document.getElementById('prompt-text').textContent = text;
  prompt.classList.remove('visible');
  void prompt.offsetWidth;
  prompt.classList.add('visible');
}

function updateScore() {
  document.getElementById('score').textContent = `⭐ ${score}`;
}

function updateProgress() {
  const pct = (stageScore / STAGE_GOALS[currentStage]) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateStageDots() {
  for (let i = 0; i < TOTAL_STAGES; i++) {
    const dot = document.getElementById('dot' + (i + 1));
    dot.className = 'stage-dot';
    if (i < currentStage) dot.classList.add('done');
    if (i === currentStage) dot.classList.add('active');
  }
}

// ===== 파티클 이펙트 =====
function spawnParticles(x, y) {
  const emojis = ['✨', '⭐', '💥', '🌟', '💫'];
  for (let i = 0; i < 6; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = pick(emojis);
    const angle = (Math.PI * 2 / 6) * i;
    const dist = rand(50, 120);
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    document.getElementById('game-area').appendChild(p);
    setTimeout(() => p.remove(), 800);
  }
}

function showPopText(x, y, text) {
  const el = document.createElement('div');
  el.className = 'pop-effect';
  el.textContent = text;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  document.getElementById('game-area').appendChild(el);
  setTimeout(() => el.remove(), 700);
}

function showConfetti() {
  const emojis = ['🎉', '🎊', '⭐', '🌟', '💫', '🎈', '🎀', '🌈'];
  for (let i = 0; i < 20; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.textContent = pick(emojis);
      c.style.left = rand(5, 95) + 'vw';
      c.style.animationDuration = rand(2, 4) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4000);
    }, i * 100);
  }
}

// ===== 게임 흐름 =====
function startGame() {
  initAudio();
  document.getElementById('intro').style.display = 'none';
  currentStage = 0;
  score = 0;
  stageScore = 0;
  updateScore();
  updateStageDots();
  showStageIntro();
}

function showStageIntro() {
  const info = STAGES[currentStage];
  document.getElementById('stage-emoji').textContent = info.emoji;
  document.getElementById('stage-title').textContent = info.title;
  document.getElementById('stage-desc').textContent = info.desc;
  const el = document.getElementById('stage-intro');
  el.classList.add('visible');
  updateStageDots();
}

function startStage() {
  document.getElementById('stage-intro').classList.remove('visible');
  stageScore = 0;
  updateProgress();
  clearGameObjects();
  if (currentStage === 0) startClickStage();
  else if (currentStage === 1) startDoubleClickStage();
  else if (currentStage === 2) startDragStage();
  else if (WORD_STAGES[currentStage]) startWordStage(currentStage);
  else if (currentStage === 7) startMemoryStage();
  else if (currentStage === 8) startMoleStage();
  else if (currentStage === 9) startFishingStage();
}

function stageComplete() {
  playCompleteSound();
  showConfetti();
  clearGameObjects();
  currentStage++;
  stageScore = 0;
  document.getElementById('progress-bar').style.width = '0%';
  if (currentStage >= TOTAL_STAGES) {
    setTimeout(() => {
      document.getElementById('complete').classList.add('visible');
      updateStageDots();
    }, 1000);
  } else {
    setTimeout(() => showStageIntro(), 1000);
  }
}

// 상단 단계 번호 클릭 → 해당 단계로 바로 이동
function jumpToStage(idx) {
  if (idx < 0 || idx >= TOTAL_STAGES) return;
  initAudio();
  playSound(700, 0.1);
  wordRoundToken++;
  dragState = null;
  document.getElementById('intro').style.display = 'none';
  document.getElementById('complete').classList.remove('visible');
  document.getElementById('stage-intro').classList.remove('visible');
  clearGameObjects();
  currentStage = idx;
  stageScore = 0;
  document.getElementById('progress-bar').style.width = '0%';
  showStageIntro();
}

function resetGame() {
  document.getElementById('complete').classList.remove('visible');
  clearGameObjects();
  currentStage = 0;
  score = 0;
  stageScore = 0;
  updateScore();
  updateProgress();
  updateStageDots();
  document.getElementById('intro').style.display = '';
}

// ===== 1단계: 클릭 =====
function startClickStage() {
  spawnClickTarget();
}

function spawnClickTarget() {
  if (stageScore >= STAGE_GOALS[0]) return;
  const { width, height } = getGameArea();
  const el = document.createElement('div');
  el.className = 'click-target';
  el.textContent = pick(CLICK_EMOJIS);
  const x = rand(40, width - 120);
  const y = rand(40, height - 120);
  el.style.left = x + 'px';
  el.style.top = y + 'px';

  el.addEventListener('click', function handler(e) {
    e.stopPropagation();
    playClickSound();
    const rect = el.getBoundingClientRect();
    const area = document.getElementById('game-area').getBoundingClientRect();
    const cx = rect.left + rect.width / 2 - area.left;
    const cy = rect.top + rect.height / 2 - area.top;
    spawnParticles(cx, cy);
    showPopText(cx - 20, cy - 30, '팡!');
    el.remove();
    score++;
    stageScore++;
    updateScore();
    updateProgress();
    if (stageScore >= STAGE_GOALS[0]) {
      stageComplete();
    } else {
      setTimeout(spawnClickTarget, 300);
    }
  });

  document.getElementById('game-area').appendChild(el);
}

// ===== 2단계: 더블클릭 =====
function startDoubleClickStage() {
  spawnEggTarget();
}

function spawnEggTarget() {
  if (stageScore >= STAGE_GOALS[1]) return;

  const el = document.createElement('div');
  el.className = 'egg-target';

// ===== 4~7단계: 글자 / 그림 찾기 (알파벳 · 한글) =====
// 4·5단계(same): 카드와 똑같은 글자/낱말 찾기
// 6·7단계(match): 글자로 시작하는 그림 찾기, 낱말에 맞는 그림 찾기
// 낱말 라운드 타일은 항상 그림으로 먼저 보이고, 더블클릭하면 낱말로 뒤집힌다.
const WORD_STAGES = {
  3: { lang: 'en', mode: 'same' },
  4: { lang: 'ko', mode: 'same' },
  5: { lang: 'en', mode: 'match' },
  6: { lang: 'ko', mode: 'match' },
};
const CHOSEONG = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
let wordRoundToken = 0;

// 낱말이 "시작하는" 글자 목록. 영어: 첫 알파벳. 한글: 첫 음절의 초성(자음만, 모음은 출제하지 않음)
function startLetters(word, lang) {
  if (lang === 'en') return [word[0]];
  const code = word.charCodeAt(0) - 0xAC00;
  if (code < 0 || code > 11171) return [];
  const cho = CHOSEONG[Math.floor(code / 588)];
  return HANGUL_JAMO.includes(cho) ? [cho] : [];
}

// 서로 낱말·그림이 겹치지 않게 n개 뽑기 (filter 조건 포함)
function pickWords(pool, n, exclude, filter) {
  const usedWord = new Set(exclude.map(w => w.word));
  const usedEmoji = new Set(exclude.map(w => w.emoji));
  const list = [...pool].sort(() => Math.random() - 0.5);
  const out = [];
  for (const w of list) {
    if (out.length >= n) break;
    if (usedWord.has(w.word) || usedEmoji.has(w.emoji)) continue;
    if (filter && !filter(w)) continue;
    usedWord.add(w.word);
    usedEmoji.add(w.emoji);
    out.push(w);
  }
  return out;
}

function buildWordRound(stageIdx) {
  const { lang, mode } = WORD_STAGES[stageIdx];
  const letters = lang === 'ko' ? HANGUL_JAMO : ALPHABET;
  const words = lang === 'ko' ? KOREAN_WORDS : ENGLISH_WORDS;
  const wordRound = stageScore % 2 === 1;  // 홀수 라운드는 낱말, 짝수 라운드는 한 글자

  if (mode === 'same') {
    if (wordRound) {
      // 카드: 그림 + 낱말 / 타일: 그림(더블클릭 → 낱말)
      const [answer] = pickWords(words, 1, []);
      const decoys = pickWords(words, 3, [answer]);
      return {
        promptEmoji: answer.emoji, promptWord: answer.word, promptText: '이 낱말을 찾아봐!',
        answer, options: [answer, ...decoys], tileMode: 'pic', wide: true,
      };
    }
    // 카드: 글자 / 타일: 글자
    const pool = [...letters].sort(() => Math.random() - 0.5);
    const [answer, ...decoys] = pool.slice(0, 6).map(t => ({ word: t, emoji: null }));
    return {
      promptEmoji: '🔎', promptWord: answer.word, promptText: '이 글자를 찾아봐!',
      answer, options: [answer, ...decoys], tileMode: 'text', wide: false,
    };
  }

  // mode === 'match'
  if (wordRound) {
    // 카드: 낱말만 / 타일: 그림 → 낱말에 맞는 그림 찾기
    const [answer] = pickWords(words, 1, []);
    const decoys = pickWords(words, 3, [answer]);
    return {
      promptEmoji: null, promptWord: answer.word, promptText: lang === 'ko' ? '이 낱말의 그림은?' : '이 단어의 그림은?',
      answer, options: [answer, ...decoys], tileMode: 'pic', wide: true,
    };
  }
  // 카드: 글자만 / 타일: 그림 → 그 글자로 시작하는 그림 찾기
  const byLetter = {};
  words.forEach(w => startLetters(w.word, lang).forEach(l => { (byLetter[l] = byLetter[l] || []).push(w); }));
  const letter = pick(Object.keys(byLetter));
  const answer = pick(byLetter[letter]);
  const decoys = pickWords(words, 5, [answer], w => !startLetters(w.word, lang).includes(letter));
  return {
    promptEmoji: null, promptWord: letter, promptText: '이 글자로 시작하는 그림은?',
    answer, options: [answer, ...decoys], tileMode: 'pic', wide: true,
  };
}

function startWordStage(stageIdx) {
  spawnWordRound(stageIdx);
}

function spawnWordRound(stageIdx) {
  if (stageScore >= STAGE_GOALS[stageIdx]) return;
  const token = ++wordRoundToken;
  const round = buildWordRound(stageIdx);

  // 안내 카드
  const prompt = document.getElementById('word-prompt');
  const pe = document.getElementById('prompt-emoji');
  pe.textContent = round.promptEmoji || '';
  pe.style.display = round.promptEmoji ? '' : 'none';
  document.getElementById('prompt-text').textContent = round.promptText;
  const pw = document.getElementById('prompt-word');
  pw.textContent = round.promptWord;
  pw.style.display = '';
  pw.classList.toggle('multi', round.promptWord.length > 1);
  prompt.classList.remove('visible');
  void prompt.offsetWidth; // 애니메이션 재시작
  prompt.classList.add('visible');

  // 후보를 서로 겹치지 않게 뿌리기 (낱말로 뒤집혔을 때 넓어지는 것까지 감안)
  const { width, height } = getGameArea();
  const area = document.getElementById('game-area');
  const isMobile = width < 600;
  const boxW = round.wide ? (isMobile ? 165 : 240) : (isMobile ? 70 : 100);
  const boxH = isMobile ? 70 : 100;
  const topPad = isMobile ? 80 : 110;  // 안내 카드 아래부터
  const placed = [];
  const shuffled = [...round.options].sort(() => Math.random() - 0.5);

  shuffled.forEach((opt, i) => {
    let x = 0, y = 0, ok = false;
    for (let tries = 0; tries < 60 && !ok; tries++) {
      x = rand(20, Math.max(20, width - boxW - 20));
      y = rand(topPad, Math.max(topPad, height - boxH - 30));
      ok = placed.every(p => Math.abs(p.x - x) > boxW + 10 || Math.abs(p.y - y) > boxH + 10);
    }
    placed.push({ x, y });

    const el = document.createElement('div');
    const startPic = round.tileMode === 'pic';
    el.className = 'word-target' + (round.wide ? ' multi' : '') + (startPic ? ' pic' : '');
    el.textContent = startPic ? opt.emoji : opt.word;
    el.dataset.word = opt.word;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.background = WORD_COLORS[(i + stageScore) % WORD_COLORS.length];
    el.style.animationDelay = (i * 0.05) + 's';

    // 그림이 있는 타일: 더블클릭하면 그림 ↔ 낱말로 뒤집힌다 (힌트 겸 더블클릭 연습)
    let clickTimer = null;
    if (opt.emoji) {
      el.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        e.preventDefault();
        if (token !== wordRoundToken) return;
        if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
        const showPic = !el.classList.contains('pic');
        el.style.animationDelay = '0s';
        el.classList.remove('flip-back');
        void el.offsetWidth;
        el.classList.toggle('pic', showPic);
        if (!showPic) el.classList.add('flip-back');
        el.textContent = showPic ? opt.emoji : opt.word;
        playHatchSound();
      });
    }

    el.addEventListener('click', (e) => {
      e.stopPropagation();
      if (token !== wordRoundToken) return;
      if (!opt.emoji) { handleAnswer(); return; }
      // 더블클릭(토글)인지 잠깐 기다렸다가 한 번 클릭이면 정답 판정
      if (clickTimer) return;
      clickTimer = setTimeout(() => { clickTimer = null; handleAnswer(); }, 250);
    });

    function handleAnswer() {
      if (token !== wordRoundToken) return;
      const rect = el.getBoundingClientRect();
      const ar = area.getBoundingClientRect();
      const cx = rect.left + rect.width / 2 - ar.left;
      const cy = rect.top + rect.height / 2 - ar.top;

      if (opt.word !== round.answer.word) {
        // 오답: 흔들리고 사라진다 (정답 선택지는 줄어듦)
        playWrongSound();
        el.classList.add('wrong');
        showPopText(cx - 30, cy - 30, '다시!');
        setTimeout(() => el.remove(), 400);
        return;
      }

      // 정답
      wordRoundToken++;
      playClickSound();
      el.classList.add('correct');
      spawnParticles(cx, cy);
      showPopText(cx - 60, cy - 50, opt.emoji ? `${opt.emoji} ${opt.word}` : '맞았어!');
      document.querySelectorAll('.word-target').forEach(t => { if (t !== el) t.remove(); });
      score++;
      stageScore++;
      updateScore();
      updateProgress();

      setTimeout(() => {
        el.remove();
        if (stageScore >= STAGE_GOALS[stageIdx]) {
          stageComplete();
        } else {
          spawnWordRound(stageIdx);
        }
      }, 600);
    }

    area.appendChild(el);
  });
}

// ===== 8단계: 짝 맞추기 (메모리 게임, 더블클릭) =====
let memOpen = [];
let memLock = false;

function startMemoryStage() {
  memOpen = [];
  memLock = false;
  const { width, height } = getGameArea();
  const isMobile = width < 600;
  const cols = isMobile ? 3 : 4;
  const rows = isMobile ? 4 : 3;
  const gap = isMobile ? 8 : 14;
  const size = Math.floor(Math.min((width - 40 - gap * (cols - 1)) / cols, (height - 120 - gap * (rows - 1)) / rows, 150));

  showPrompt('', '🃏', '더블클릭으로 카드를 뒤집어 그림과 낱말 짝을 찾아봐!');

  // 영어 3 + 한글 3 낱말 → 그림 카드 + 낱말 카드
  const en = pickWords(ENGLISH_WORDS.filter(w => w.word.length <= 6), 3, []);
  const ko = pickWords(KOREAN_WORDS.filter(w => w.word.length <= 3), 3, []);
  const cards = [];
  [...en, ...ko].forEach((w, key) => {
    cards.push({ key, face: w.emoji, kind: 'pic' });
    cards.push({ key, face: w.word, kind: 'word' });
  });
  cards.sort(() => Math.random() - 0.5);

  const grid = document.createElement('div');
  grid.className = 'mem-grid';
  grid.style.gridTemplateColumns = `repeat(${cols}, ${size}px)`;
  grid.style.gap = gap + 'px';
  const gw = cols * size + (cols - 1) * gap;
  const gh = rows * size + (rows - 1) * gap;
  grid.style.left = Math.max(10, (width - gw) / 2) + 'px';
  grid.style.top = Math.max(90, 90 + (height - 90 - gh) / 2) + 'px';

  cards.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'mem-card';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.fontSize = Math.round(size * 0.4) + 'px';
    el.style.animationDelay = (i * 0.04) + 's';
    el.textContent = '❓';
    el.dataset.key = c.key;
    el.dataset.face = c.face;
    el.dataset.kind = c.kind;

    el.addEventListener('click', (e) => {
      e.stopPropagation();
      if (el.classList.contains('open')) return;
      el.classList.remove('nudge');
      void el.offsetWidth;
      el.classList.add('nudge');
      playSound(500, 0.08);
    });

    el.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      e.preventDefault();
      if (memLock || el.classList.contains('open')) return;
      revealCard(el, c, size);
    });

    grid.appendChild(el);
  });

  document.getElementById('game-area').appendChild(grid);
}

function revealCard(el, c, size) {
  el.classList.add('open');
  el.textContent = c.face;
  const len = c.face.length;
  el.style.fontSize = Math.round(size * (c.kind === 'pic' ? 0.5 : len <= 2 ? 0.4 : len <= 4 ? 0.3 : 0.22)) + 'px';
  playHatchSound();
  memOpen.push(el);
  if (memOpen.length < 2) return;

  memLock = true;
  const [a, b] = memOpen;
  memOpen = [];
  if (a.dataset.key === b.dataset.key) {
    a.classList.add('matched');
    b.classList.add('matched');
    playDropSound();
    const ar = document.getElementById('game-area').getBoundingClientRect();
    const r = b.getBoundingClientRect();
    const cx = r.left + r.width / 2 - ar.left;
    const cy = r.top + r.height / 2 - ar.top;
    spawnParticles(cx, cy);
    const pic = a.dataset.kind === 'pic' ? a.dataset.face : b.dataset.face;
    const word = a.dataset.kind === 'word' ? a.dataset.face : b.dataset.face;
    showPopText(cx - 60, cy - 50, `${pic} ${word}`);
    score++;
    stageScore++;
    updateScore();
    updateProgress();
    memLock = false;
    if (stageScore >= STAGE_GOALS[7]) later(stageComplete, 500);
  } else {
    playWrongSound();
    later(() => {
      [a, b].forEach(x => {
        x.classList.remove('open');
        x.textContent = '❓';
        x.style.fontSize = Math.round(size * 0.4) + 'px';
      });
      memLock = false;
    }, 900);
  }
}

// ===== 9단계: 두더지 잡기 (클릭) =====
let moleTarget = null;

function setMoleTarget() {
  const lang = Math.random() < 0.5 ? 'en' : 'ko';
  const letters = lang === 'ko' ? HANGUL_JAMO.slice(0, 14) : ALPHABET;
  moleTarget = { lang, letter: pick(letters), letters };
  showPrompt(moleTarget.letter, '🔨', '이 글자 두더지를 잡아라!');
}

function startMoleStage() {
  const { width, height } = getGameArea();
  const isMobile = width < 600;
  const bw = Math.min(width - 30, 560);
  const bh = Math.min(height - (isMobile ? 90 : 120), 440);
  const board = document.createElement('div');
  board.className = 'mole-board';
  board.style.width = bw + 'px';
  board.style.height = bh + 'px';
  board.style.left = (width - bw) / 2 + 'px';
  board.style.top = (isMobile ? 80 : 105) + 'px';
  board.style.gap = (isMobile ? 6 : 12) + 'px';

  for (let i = 0; i < 9; i++) {
    const hole = document.createElement('div');
    hole.className = 'mole-hole';
    const mole = document.createElement('div');
    mole.className = 'mole';
    mole.innerHTML = '<span class="mole-letter"></span><span class="mole-face">🐹</span>';
    mole.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!mole.classList.contains('up') || mole.dataset.busy) return;
      whackMole(mole);
    });
    hole.appendChild(mole);
    board.appendChild(hole);
  }
  document.getElementById('game-area').appendChild(board);

  setMoleTarget();
  later(spawnMole, 800);
}

function spawnMole() {
  if (stageScore >= STAGE_GOALS[8]) return;
  const moles = [...document.querySelectorAll('.mole')];
  const free = moles.filter(m => !m.classList.contains('up') && !m.dataset.busy);
  const upCount = moles.length - free.length;
  if (free.length && upCount < 2) {
    const mole = pick(free);
    // 정답 두더지가 이미 나와 있으면 확률을 낮추고, 없으면 높여서 너무 오래 기다리지 않게
    const targetUp = moles.some(m => m.classList.contains('up') && m.dataset.letter === moleTarget.letter);
    const isTarget = Math.random() < (targetUp ? 0.2 : 0.55);
    const letter = isTarget ? moleTarget.letter : pick(moleTarget.letters.filter(l => l !== moleTarget.letter));
    mole.dataset.letter = letter;
    mole.querySelector('.mole-letter').textContent = letter;
    mole.classList.add('up');
    const showId = String(Date.now() + Math.random());
    mole.dataset.showId = showId;
    const stay = Math.max(2200, 3000 - stageScore * 80);  // 6살 기준: 2.2~3초 머무름
    later(() => { if (mole.dataset.showId === showId && !mole.dataset.busy) mole.classList.remove('up'); }, stay);
  }
  later(spawnMole, rand(1100, 1600));
}

function whackMole(mole) {
  const ar = document.getElementById('game-area').getBoundingClientRect();
  const r = mole.getBoundingClientRect();
  const cx = r.left + r.width / 2 - ar.left;
  const cy = r.top + r.height / 2 - ar.top;

  if (mole.dataset.letter !== moleTarget.letter) {
    playWrongSound();
    mole.classList.add('bonk');
    showPopText(cx - 30, cy - 40, '아니야!');
    later(() => { mole.classList.remove('bonk', 'up'); }, 300);
    return;
  }

  mole.dataset.busy = '1';
  playClickSound();
  spawnParticles(cx, cy);
  showPopText(cx - 40, cy - 50, `${moleTarget.letter} 잡았다!`);
  mole.classList.remove('up');
  later(() => { delete mole.dataset.busy; }, 500);

  score++;
  stageScore++;
  updateScore();
  updateProgress();

  if (stageScore >= STAGE_GOALS[8]) {
    stopStageLoops();
    later(stageComplete, 400);
  } else if (stageScore % 2 === 0) {
    setMoleTarget();
  }
}

// ===== 10단계: 낚시 (드래그) =====
let fishes = [];
let fishRound = null;

function startFishingStage() {
  const { width, height } = getGameArea();
  const isMobile = width < 600;
  const area = document.getElementById('game-area');

  const basketSize = isMobile ? 84 : 130;
  const pondTop = isMobile ? 92 : 105;
  const pond = { left: 16, top: pondTop, width: width - 32 - basketSize - 16, height: height - pondTop - 16 };
  const pondEl = document.createElement('div');
  pondEl.className = 'pond';
  pondEl.style.left = pond.left + 'px';
  pondEl.style.top = pond.top + 'px';
  pondEl.style.width = pond.width + 'px';
  pondEl.style.height = pond.height + 'px';
  area.appendChild(pondEl);

  const basket = document.createElement('div');
  basket.className = 'basket';
  basket.textContent = '🧺';
  basket.style.width = basketSize + 'px';
  basket.style.height = basketSize + 'px';
  basket.style.left = (width - basketSize - 16) + 'px';
  basket.style.top = (height - basketSize - 16) + 'px';
  area.appendChild(basket);

  fishRound = { pond, basket, lang: 'en', isMobile };
  dropHandler = onFishDrop;
  nextFishRound();
  stageRaf = requestAnimationFrame(swimFishes);
}

function nextFishRound() {
  fishes.forEach(f => f.el.remove());
  fishes = [];
  const lang = fishRound.lang = fishRound.lang === 'en' ? 'ko' : 'en';
  const words = lang === 'ko' ? KOREAN_WORDS : ENGLISH_WORDS;
  const letters = lang === 'ko' ? HANGUL_JAMO.slice(0, 14) : ALPHABET;
  const candidates = words.filter(w => startLetters(w.word, lang).length);
  const word = pick(candidates);
  const target = startLetters(word.word, lang)[0];
  fishRound.target = target;
  showPrompt(word.word, word.emoji, '첫 글자 물고기를 바구니에 넣자!');

  const decoys = letters.filter(l => l !== target).sort(() => Math.random() - 0.5).slice(0, 4);
  const all = [target, ...decoys].sort(() => Math.random() - 0.5);
  const { pond, isMobile } = fishRound;
  const fishH = isMobile ? 50 : 70;
  const fishW = isMobile ? 110 : 150;
  const laneH = (pond.height - 20) / all.length;

  all.forEach((letter, i) => {
    const el = document.createElement('div');
    el.className = 'drag-item fish';
    el.dataset.letter = letter;
    el.innerHTML = `<span class="fish-emoji">🐟</span><span class="fish-letter">${letter}</span>`;
    const y = pond.top + 10 + laneH * i + Math.max(0, (laneH - fishH) / 2);
    const x = rand(pond.left + 10, Math.max(pond.left + 10, pond.left + pond.width - fishW - 10));
    const speed = (isMobile ? 0.6 : 0.9) + Math.random() * 0.8;
    const f = { el, x, y, vx: Math.random() < 0.5 ? speed : -speed, w: fishW, dragging: false };
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.querySelector('.fish-emoji').style.transform = f.vx > 0 ? 'scaleX(-1)' : '';

    el.addEventListener('mousedown', (e) => { e.preventDefault(); f.dragging = true; startDrag(el, e.clientX, e.clientY); });
    el.addEventListener('touchstart', (e) => { e.preventDefault(); const t = e.touches[0]; f.dragging = true; startDrag(el, t.clientX, t.clientY); }, { passive: false });

    document.getElementById('game-area').appendChild(el);
    fishes.push(f);
  });
}

function swimFishes() {
  const { pond } = fishRound;
  fishes.forEach(f => {
    if (f.dragging) return;
    f.x += f.vx;
    const minX = pond.left + 6;
    const maxX = pond.left + pond.width - f.w - 6;
    if (f.x <= minX) { f.x = minX; f.vx = Math.abs(f.vx); }
    if (f.x >= maxX) { f.x = maxX; f.vx = -Math.abs(f.vx); }
    f.el.style.left = f.x + 'px';
    f.el.querySelector('.fish-emoji').style.transform = f.vx > 0 ? 'scaleX(-1)' : '';
  });
  stageRaf = requestAnimationFrame(swimFishes);
}

function onFishDrop(item, clientX, clientY) {
  const f = fishes.find(x => x.el === item);
  if (!f) return;
  const { pond, basket, target } = fishRound;
  const ar = document.getElementById('game-area').getBoundingClientRect();
  const br = basket.getBoundingClientRect();
  const inBasket = clientX > br.left && clientX < br.right && clientY > br.top && clientY < br.bottom;
  const bx = br.left + br.width / 2 - ar.left;
  const by = br.top + br.height / 2 - ar.top;

  if (inBasket && item.dataset.letter === target) {
    playDropSound();
    basket.classList.add('matched');
    spawnParticles(bx, by);
    showPopText(bx - 60, by - 70, `${target} 잡았다!`);
    item.remove();
    fishes = fishes.filter(x => x !== f);
    score++;
    stageScore++;
    updateScore();
    updateProgress();
    later(() => {
      basket.classList.remove('matched');
      if (stageScore >= STAGE_GOALS[9]) stageComplete();
      else nextFishRound();
    }, 700);
    return;
  }

  if (inBasket) {
    playWrongSound();
    basket.classList.remove('bonk');
    void basket.offsetWidth;
    basket.classList.add('bonk');
    showPopText(bx - 30, by - 70, '아니야!');
  }

  // 연못 안으로 되돌려 다시 헤엄치게
  const left = parseFloat(item.style.left) || f.x;
  const top = parseFloat(item.style.top) || f.y;
  f.x = Math.min(Math.max(left, pond.left + 6), pond.left + pond.width - f.w - 6);
  f.y = Math.min(Math.max(top, pond.top + 6), pond.top + pond.height - 60);
  item.style.left = f.x + 'px';
  item.style.top = f.y + 'px';
  f.dragging = false;
}

// ===== 3단계: 드래그 =====
let dragState = null;

function startDragStage() {
  spawnDragPuzzle();
}

function spawnDragPuzzle() {
  if (stageScore >= STAGE_GOALS[2]) return;

  const { width, height } = getGameArea();
  const pair = DRAG_PAIRS[stageScore % DRAG_PAIRS.length];

  // 드롭 영역 (오른쪽에 배치)
  const zone = document.createElement('div');
  zone.className = 'drop-zone';
  zone.textContent = pair.item;
  zone.dataset.emoji = pair.item;
  const zx = rand(width / 2 + 40, width - 160);
  const zy = rand(60, height - 180);
  zone.style.left = zx + 'px';
  zone.style.top = zy + 'px';
  document.getElementById('game-area').appendChild(zone);

  // 드래그 아이템 (왼쪽에 배치)
  const item = document.createElement('div');
  item.className = 'drag-item';
  item.textContent = pair.item;
  item.dataset.emoji = pair.item;
  const ix = rand(40, width / 2 - 100);
  const iy = rand(60, height - 140);
  item.style.left = ix + 'px';
  item.style.top = iy + 'px';

  // 마우스 드래그
  item.addEventListener('mousedown', (e) => {
    e.preventDefault();
    startDrag(item, e.clientX, e.clientY);
  });

  // 터치 드래그
  item.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    startDrag(item, t.clientX, t.clientY);
  }, { passive: false });

  document.getElementById('game-area').appendChild(item);
}

function startDrag(item, startX, startY) {
  const area = document.getElementById('game-area').getBoundingClientRect();
  const rect = item.getBoundingClientRect();
  const offsetX = startX - rect.left;
  const offsetY = startY - rect.top;

  item.classList.add('dragging');
  dragState = { item, offsetX, offsetY, areaLeft: area.left, areaTop: area.top };
}

document.addEventListener('mousemove', (e) => {
  if (!dragState) return;
  moveDrag(e.clientX, e.clientY);
});

document.addEventListener('touchmove', (e) => {
  if (!dragState) return;
  const t = e.touches[0];
  moveDrag(t.clientX, t.clientY);
}, { passive: false });

function moveDrag(clientX, clientY) {
  if (!dragState) return;
  const { item, offsetX, offsetY, areaLeft, areaTop } = dragState;
  item.style.left = (clientX - areaLeft - offsetX) + 'px';
  item.style.top = (clientY - areaTop - offsetY) + 'px';

  // 드롭 영역 하이라이트
  document.querySelectorAll('.drop-zone, .basket').forEach(zone => {
    const zr = zone.getBoundingClientRect();
    const cx = clientX;
    const cy = clientY;
    if (cx > zr.left && cx < zr.right && cy > zr.top && cy < zr.bottom) {
      zone.classList.add('highlight');
    } else {
      zone.classList.remove('highlight');
    }
  });
}

document.addEventListener('mouseup', (e) => {
  if (!dragState) return;
  endDrag(e.clientX, e.clientY);
});

document.addEventListener('touchend', (e) => {
  if (!dragState) return;
  const t = e.changedTouches[0];
  endDrag(t.clientX, t.clientY);
});

function endDrag(clientX, clientY) {
  if (!dragState) return;
  const { item } = dragState;
  item.classList.remove('dragging');

  if (dropHandler) {
    dragState = null;
    document.querySelectorAll('.basket').forEach(b => b.classList.remove('highlight'));
    dropHandler(item, clientX, clientY);
    return;
  }

  let matched = false;
  document.querySelectorAll('.drop-zone').forEach(zone => {
    zone.classList.remove('highlight');
    const zr = zone.getBoundingClientRect();
    if (clientX > zr.left && clientX < zr.right && clientY > zr.top && clientY < zr.bottom) {
      if (item.dataset.emoji === zone.dataset.emoji) {
        matched = true;
        playDropSound();
        zone.classList.add('matched');

        const area = document.getElementById('game-area').getBoundingClientRect();
        const cx = zr.left + zr.width / 2 - area.left;
        const cy = zr.top + zr.height / 2 - area.top;
        spawnParticles(cx, cy);
        showPopText(cx - 30, cy - 40, '잘했어!');

        item.remove();
        score++;
        stageScore++;
        updateScore();
        updateProgress();

        setTimeout(() => {
          zone.remove();
          if (stageScore >= STAGE_GOALS[2]) {
            stageComplete();
          } else {
            spawnDragPuzzle();
          }
        }, 600);
      }
    }
  });

  dragState = null;
}

// 텍스트 선택 및 컨텍스트 메뉴 방지
document.addEventListener('contextmenu', e => e.preventDefault());

// ===== 큰 커스텀 커서 =====
const customCursor = document.getElementById('custom-cursor');
const cursorDefault = customCursor.querySelector('.cursor-default');
const cursorPointer = customCursor.querySelector('.cursor-pointer');
const cursorGrab = customCursor.querySelector('.cursor-grab');
let cursorMode = '';

function setCursorMode(mode) {
  if (cursorMode === mode) return;
  cursorMode = mode;
  cursorDefault.style.display = mode === 'default' ? '' : 'none';
  cursorPointer.style.display = mode === 'pointer' ? '' : 'none';
  cursorGrab.style.display = mode === 'grab' ? '' : 'none';
  customCursor.className = 'mode-' + mode;
}

setCursorMode('default');

document.addEventListener('mousemove', (e) => {
  customCursor.style.left = e.clientX + 'px';
  customCursor.style.top = e.clientY + 'px';

  // 드래그 중이면 grab 유지
  if (dragState) {
    setCursorMode('grab');
    return;
  }

  // 호버 대상 체크
  const el = document.elementFromPoint(e.clientX, e.clientY);
  if (el && el.closest('.click-target, .egg-target, .drag-item, .word-target, .stage-dot, .mem-card, .mole.up')) {
    setCursorMode('pointer');
  } else {
    setCursorMode('default');
  }
});

document.addEventListener('mousedown', () => {
  customCursor.style.scale = '0.85';
});
document.addEventListener('mouseup', () => {
  customCursor.style.scale = '1';
  if (!dragState) setCursorMode('default');
});
</script>
